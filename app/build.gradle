plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zach.motionfit'
    compileSdk 34

    defaultConfig {
        applicationId "com.zach.motionfit"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
